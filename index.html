  <style>
    /* Image Carousel Styles */
    .image-carousel {
      position: relative;
      width: 100%;
      height: 500px;
      overflow: hidden;
      background: #000;
    }

    .carousel-slides {
      display: flex;
      transition: transform 0.8s ease-in-out;
      height: 100%;
    }

    .carousel-slide {
      min-width: 100%;
      height: 100%;
      position: relative;
    }

    .carousel-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.85;
    }

    .carousel-caption {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      text-align: center;
      background: rgba(0, 0, 0, 0.6);
      padding: 15px 30px;
      border-radius: 5px;
      max-width: 80%;
    }

    .carousel-caption h3 {
      margin: 0 0 10px 0;
      font-size: 24px;
      font-weight: bold;
    }

    .carousel-caption p {
      margin: 0;
      font-size: 16px;
    }

    .carousel-nav {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .carousel-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      transition: background 0.3s;
    }

    .carousel-dot.active {
      background: white;
    }

    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.3);
      color: white;
      border: none;
      font-size: 30px;
      padding: 15px 20px;
      cursor: pointer;
      z-index: 10;
      transition: background 0.3s;
    }

    .carousel-arrow:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    .carousel-arrow.prev {
      left: 20px;
    }

    .carousel-arrow.next {
      right: 20px;
    }

    @media (max-width: 768px) {
      .image-carousel {
        height: 350px;
      }

      .carousel-caption h3 {
        font-size: 18px;
      }

      .carousel-caption p {
        font-size: 14px;
      }

      .carousel-arrow {
        font-size: 20px;
        padding: 10px 15px;
      }
    }
  </style>
