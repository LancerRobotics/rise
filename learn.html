<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Learn - RISE Robotics</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #loginBox, #curriculumContent {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.15);
      text-align: center;
      max-width: 800px;
      width: 90%;
    }
    input {
      padding: 10px;
      width: 80%;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: #0077cc;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Password box -->
  <div id="loginBox">
    <h2>Enter Password to Access RISE Curriculum</h2>
    <input type="password" id="passwordInput" placeholder="Password">
    <br>
    <button onclick="checkPassword()">Submit</button>
    <p id="error" style="color: red;"></p>
  </div>

  <!-- Curriculum section (hidden initially) -->
  <div id="curriculumContent" style="display: none;">
    <h1>RISE Robotics Curriculum</h1>
    <p>Welcome to the private learning materials.</p>

    <!-- You can replace this section with your actual curriculum -->
    <ul>
      <li><a href="modules/module1.html">Module 1: Basics of Robotics</a></li>
      <li><a href="modules/module2.html">Module 2: Sensors & Control</a></li>
      <li><a href="modules/module3.html">Module 3: Programming</a></li>
    </ul>

    <button onclick="logout()">Log Out</button>
  </div>

  <script>
    const correctPassword = "RISE2025"; // change this to your real password

    // If the user already entered the password before
    if (localStorage.getItem("learnAccess") === "true") {
      showCurriculum();
    }

    function checkPassword() {
      const input = document.getElementById("passwordInput").value;
      if (input === correctPassword) {
        localStorage.setItem("learnAccess", "true");
        showCurriculum();
      } else {
        document.getElementById("error").innerText = "Incorrect password.";
      }
    }

    function showCurriculum() {
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("curriculumContent").style.display = "block";
    }

    function logout() {
      localStorage.removeItem("learnAccess");
      location.reload();
    }
  </script>

</body>
</html>
