<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Learn - RISE Robotics</title>
  
  <!-- bootstrap core css -->
  <link rel="stylesheet" type="text/css" href="css/bootstrap.css" />
  <!-- font awesome style -->
  <link rel="stylesheet" type="text/css" href="css/font-awesome.min.css" />
  <!-- Custom styles -->
  <link href="css/style.css" rel="stylesheet" />
  <!-- responsive style -->
  <link href="css/responsive.css" rel="stylesheet" />
  
  <link rel="apple-touch-icon" sizes="180x180" href="images/rise-logo.png">
  <link rel="icon" type="image/png" sizes="32x32" href="images/rise-logo.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/rise-logo.png">
  <link rel="shortcut icon" href="images/rise-logo.png">
  
  <style>
    body {
      margin: 0;
      padding: 0;
    }
    
    .login_section {
      padding: 90px 0;
      min-height: calc(100vh - 200px);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
    }
    
    #loginBox {
      background: white;
      padding: 3rem 2rem;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 450px;
      width: 100%;
    }
    
    #loginBox h2 {
      color: #333;
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
      font-weight: 600;
    }
    
    #loginBox input {
      padding: 12px 15px;
      width: 100%;
      margin: 15px 0;
      border-radius: 8px;
      border: 2px solid #e0e0e0;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    
    #loginBox input:focus {
      outline: none;
      border-color: #0077cc;
    }
    
    #loginBox button {
      padding: 12px 40px;
      border: none;
      border-radius: 8px;
      background: #0077cc;
      color: white;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      margin-top: 10px;
      transition: background 0.3s;
    }
    
    #loginBox button:hover {
      background: #005fa3;
    }
    
    #error {
      color: #d32f2f;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="hero_area">
    <!-- header section starts -->
    <header class="header_section">
      <div class="header_bottom">
        <div class="container-fluid">
          <nav class="navbar navbar-expand-lg custom_nav-container">
            <a class="navbar-brand" href="index.html">
              <span>RISE</span>
            </a>

            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
              <span class=""> </span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
              <ul class="navbar-nav">
                <li class="nav-item">
                  <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="about.html">About</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="ourteam.html">Our Team</a>
                </li>
                <li class="nav-item active">
                  <a class="nav-link" href="learn.html">Learn <span class="sr-only">(current)</span></a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="index.html#contact-us">Contact Us</a>
                </li>
              </ul>
            </div>
          </nav>
        </div>
      </div>
    </header>
  </div>

  <section class="login_section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
          <div id="loginBox">
            <h2>Enter Password to Access Learn Materials</h2>
            <input type="password" id="passwordInput" placeholder="Password">
            <br>
            <button onclick="checkPassword()">Submit</button>
            <p id="error"></p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- info section -->
  <section class="info_section">
    <div class="social-box">
      <h4>Follow Us</h4>
      <div class="box">
        <a href="">
          <i class="fa fa-facebook" aria-hidden="true"></i>
        </a>
        <a href="">
          <i class="fa fa-twitter" aria-hidden="true"></i>
        </a>
        <a href="">
          <i class="fa fa-youtube" aria-hidden="true"></i>
        </a>
        <a href="https://www.instagram.com/rise.robotics/">
          <i class="fa fa-instagram" aria-hidden="true"></i>
        </a>
      </div>
    </div>
  </section>

  <script src="js/jquery-3.4.1.min.js"></script>
  <script src="js/bootstrap.js"></script>
  <script src="js/custom.js"></script>
  
  <script>
    const correctPassword = "RISE2025"; // change to your password
    
    // Check if user has already authenticated
    window.onload = function() {
      const isAuthenticated = localStorage.getItem("riseAuthenticated");
      
      // If authenticated, always redirect to curriculum (no special case for referrer)
      if (isAuthenticated === "true") {
        window.location.href = "/curriculum/curriculum.html";
      }
    };
    
    function checkPassword() {
      const input = document.getElementById("passwordInput").value;
      if (input === correctPassword) {
        // Save authentication status
        localStorage.setItem("riseAuthenticated", "true");
        // Redirect to curriculum page with absolute path
        window.location.href = "/curriculum/curriculum.html";
      } else {
        document.getElementById("error").innerText = "Incorrect password.";
      }
    }
    
    // Allow pressing Enter to submit
    document.getElementById("passwordInput").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        checkPassword();
      }
    });
  </script>
</body>
</html>
