<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Learn - RISE Robotics</title>
  
  <!-- bootstrap core css -->
  <link rel="stylesheet" type="text/css" href="css/bootstrap.css" />
  <!-- font awesome style -->
  <link rel="stylesheet" type="text/css" href="css/font-awesome.min.css" />
  <!-- Custom styles -->
  <link href="css/style.css" rel="stylesheet" />
  <!-- responsive style -->
  <link href="css/responsive.css" rel="stylesheet" />
  
  <link rel="apple-touch-icon" sizes="180x180" href="images/rise-logo.png">
  <link rel="icon" type="image/png" sizes="32x32" href="images/rise-logo.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/rise-logo.png">
  <link rel="shortcut icon" href="images/rise-logo.png">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f2ebc7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hero_area {
      flex-shrink: 0;
    }

    .learn-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
    }

    .button-container {
      text-align: center;
      max-width: 800px;
      width: 100%;
    }

    .button-container h1 {
      font-family: 'Merriweather Sans', sans-serif;
      color: #000000;
      margin-bottom: 20px;
      font-size: 2.5rem;
      font-weight: bold;
    }

    .button-container p {
      color: #444;
      font-size: 1.1rem;
      margin-bottom: 50px;
    }

    .learn-buttons {
      display: flex;
      gap: 30px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .learn-btn {
      display: inline-block;
      padding: 40px 60px;
      font-size: 1.8rem;
      font-weight: bold;
      font-family: 'Merriweather Sans', sans-serif;
      text-transform: uppercase;
      background-color: #ffffff;
      border: 3px solid #D6CFAF;
      border-radius: 15px;
      color: #000000;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      min-width: 250px;
    }

    .learn-btn:hover {
      background-color: #D6CFAF;
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      text-decoration: none;
      color: #000000;
    }

    .learn-btn:active {
      transform: translateY(-2px);
    }

    @media (max-width: 768px) {
      .button-container h1 {
        font-size: 2rem;
      }

      .button-container p {
        font-size: 1rem;
      }

      .learn-btn {
        padding: 30px 40px;
        font-size: 1.5rem;
        min-width: 200px;
      }

      .learn-buttons {
        gap: 20px;
      }
    }

    @media (max-width: 480px) {
      .learn-btn {
        padding: 25px 35px;
        font-size: 1.3rem;
        min-width: 180px;
      }
    }
  </style>
</head>

<body>
  <div class="hero_area">
    <!-- header section starts -->
    <header class="header_section">
      <div class="header_bottom">
        <div class="container-fluid">
          <nav class="navbar navbar-expand-lg custom_nav-container">
            <a class="navbar-brand" href="index.html">
              <span>RISE</span>
            </a>

            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
              <span class=""> </span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
              <ul class="navbar-nav">
                <li class="nav-item">
                  <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="about.html">About</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="ourteam.html">Our Team</a>
                </li>
                <li class="nav-item active">
                  <a class="nav-link" href="learn.html">Learn <span class="sr-only">(current)</span></a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="index.html#contact-us">Contact Us</a>
                </li>
              </ul>
            </div>
          </nav>
        </div>
      </div>
    </header>
  </div>

  <!-- Learn Content Section -->
  <section class="learn-content">
    <div class="button-container">
      <h1>Choose Your Learning Path</h1>
      <p>Select whether you want to learn about building robots or coding them!</p>
      
      <div class="learn-buttons">
        <a href="curriculum/build.html" class="learn-btn">Build</a>
        <a href="curriculum/curriculum.html" class="learn-btn">Code</a>
      </div>
    </div>
  </section>

  <!-- info section -->
  <section class="info_section">
    <div class="social-box">
      <h4>Follow Us</h4>
      <div class="box">
        <a href="">
          <i class="fa fa-facebook" aria-hidden="true"></i>
        </a>
        <a href="">
          <i class="fa fa-twitter" aria-hidden="true"></i>
        </a>
        <a href="">
          <i class="fa fa-youtube" aria-hidden="true"></i>
        </a>
        <a href="https://www.instagram.com/rise.robotics/">
          <i class="fa fa-instagram" aria-hidden="true"></i>
        </a>
      </div>
    </div>
  </section>

  <script src="js/jquery-3.4.1.min.js"></script>
  <script src="js/bootstrap.js"></script>
  <script src="js/custom.js"></script>
</body>
</html>
